name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build Backend + Frontend and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (dist + dist-ssr)
        env:
          VITE_DATA_DRIVER: http
          VITE_API_BASE_URL: /api
        run: npm run web:build

      - name: Build backend binary
        run: |
          set -euo pipefail
          mkdir -p release
          pushd apps/server >/dev/null
          go mod download
          # github.com/chai2010/webp requires CGO; CGO_ENABLED=0 will fail with undefined webp symbols.
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -o ../../release/plaindoc-server-linux-amd64 ./cmd/server
          popd >/dev/null

      - name: Package release artifacts
        run: |
          set -euo pipefail
          tar -C apps/web -czf "release/plaindoc-web-${GITHUB_REF_NAME}.tar.gz" dist dist-ssr
          mkdir -p "release/plaindoc-bundle/apps/web"
          cp "release/plaindoc-server-linux-amd64" "release/plaindoc-bundle/plaindoc-server-linux-amd64"
          cp -R "apps/web/dist" "release/plaindoc-bundle/apps/web/"
          cp -R "apps/web/dist-ssr" "release/plaindoc-bundle/apps/web/"
          tar -czf "release/plaindoc-server-linux-amd64-${GITHUB_REF_NAME}.tar.gz" \
            -C release/plaindoc-bundle \
            plaindoc-server-linux-amd64 \
            apps/web/dist \
            apps/web/dist-ssr
          sha256sum \
            "release/plaindoc-server-linux-amd64" \
            "release/plaindoc-server-linux-amd64-${GITHUB_REF_NAME}.tar.gz" \
            "release/plaindoc-web-${GITHUB_REF_NAME}.tar.gz" \
            > "release/checksums-${GITHUB_REF_NAME}.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/plaindoc-server-linux-amd64
            release/plaindoc-server-linux-amd64-${{ github.ref_name }}.tar.gz
            release/plaindoc-web-${{ github.ref_name }}.tar.gz
            release/checksums-${{ github.ref_name }}.txt

  docker_publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build_and_release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DockerHub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not configured."
            exit 1
          fi

      - name: Resolve image name
        id: image
        env:
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          repo="${DOCKERHUB_REPOSITORY:-}"
          if [ -z "$repo" ]; then
            repo="${DOCKERHUB_USERNAME}/plaindoc"
          fi
          echo "name=$repo" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_DATA_DRIVER=http
            VITE_API_BASE_URL=/api
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
